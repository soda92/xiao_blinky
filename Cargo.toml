[package]
name = "xiao_blinky"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["device"] }
panic-probe = { version = "0.3", features = ["print-defmt"] }
log = "0.4"
heapless = "0.8"

# Switch to git versions to ensure compatibility with nrf-softdevice
embassy-executor = { git = "https://github.com/embassy-rs/embassy", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-nrf = { git = "https://github.com/embassy-rs/embassy", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", features = ["defmt"] }
embassy-futures = { git = "https://github.com/embassy-rs/embassy" }

# nrf-softdevice
nrf-softdevice = { git = "https://github.com/embassy-rs/nrf-softdevice", features = ["defmt", "nrf52840", "s140", "ble-peripheral", "ble-gatt-server"] }
nrf-softdevice-s140 = { git = "https://github.com/embassy-rs/nrf-softdevice" }

# Logging (we'll keep defmt available as it's standard for softdevice debugging)
defmt = "1.0"
defmt-rtt = "1.1"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
opt-level = "s"
overflow-checks = false
